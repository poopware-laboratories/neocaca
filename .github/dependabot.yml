# Newer releases of the GitHub Actions the workflows use, once a week, in
# one pull request. The workflows pin each action to a commit SHA with its
# release in a comment; Dependabot updates both. Its titles carry the
# `ci(deps):` prefix, so they pass the Conventional Commit title check.
# Only Actions: the one code dependency, mimalloc, is bumped by hand with
# benchmark numbers (AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
