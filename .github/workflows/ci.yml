name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every required job uses the Zig release pinned by `minimum_zig_version` in
# build.zig.zon (setup-zig reads it when no `version` is given; Alpine reads
# it in .github/scripts/install-zig.sh). The `zig-latest` job tries the
# newest stable release as an early warning, without blocking.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build fmt-check

  # glibc on Ubuntu, and macOS on Apple Silicon.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [debug, safe]
    runs-on: ${{ matrix.os }}
    # A hung test fails within --test-timeout, naming itself. A hang outside
    # any test (compiling, the build runner, a test binary's start or exit)
    # fails at its step's timeout-minutes of 15 (the slowest step takes
    # about 3 today); the job's 45 is the last resort.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all --test-timeout 3m
        timeout-minutes: 15
      # The shipping configuration also runs with mimalloc's hardening off,
      # so a test cannot pass only because of the padding it adds.
      - if: matrix.optimize == 'safe'
        run: zig build test -Doptimize=safe -Dmimalloc-secure=off --summary all --test-timeout 3m
        timeout-minutes: 15
      - if: matrix.optimize == 'safe'
        run: zig build -Doptimize=safe
      - if: matrix.optimize == 'safe'
        uses: actions/upload-artifact@v4
        with:
          name: neocaca-${{ runner.os }}-${{ runner.arch }}
          path: zig-out/bin/neocaca
          if-no-files-found: error

  # musl on Alpine: the tests run natively against musl, and the release
  # binary must be fully static (no dynamic loader at all).
  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        optimize: [debug, safe]
    steps:
      - run: apk add --no-cache curl file git jq tar xz
      - uses: actions/checkout@v4
      - run: .github/scripts/install-zig.sh
      - run: zig build test -Dtarget=x86_64-linux-musl -Doptimize=${{ matrix.optimize }} --summary all --test-timeout 3m
        timeout-minutes: 15
      - if: matrix.optimize == 'safe'
        run: zig build test -Dtarget=x86_64-linux-musl -Doptimize=safe -Dmimalloc-secure=off --summary all --test-timeout 3m
        timeout-minutes: 15
      - if: matrix.optimize == 'safe'
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=safe
      - if: matrix.optimize == 'safe'
        name: The binary is statically linked
        run: |
          file zig-out/bin/neocaca
          file zig-out/bin/neocaca | grep -q 'statically linked'
      - if: matrix.optimize == 'safe'
        uses: actions/upload-artifact@v4
        with:
          name: neocaca-x86_64-linux-musl
          path: zig-out/bin/neocaca
          if-no-files-found: error

  # aarch64 under qemu on Linux: the same CPU as the macOS runners, in
  # minutes instead of a macOS queue. aarch64-only miscompiles (the vector
  # overflow checks in ReleaseSafe, for one) show up here first.
  qemu-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        optimize: [debug, safe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: zig build test -Dtarget=aarch64-linux-musl -Doptimize=${{ matrix.optimize }} -fqemu --summary all --test-timeout 3m
        timeout-minutes: 15

  # A ReleaseSafe build and artifact for every supported target.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=safe
      - run: zig build compare-build -Dtarget=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: neocaca-cross-${{ matrix.target }}
          path: zig-out/bin/neocaca
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      # A smoke run: the kernels must agree with their scalar references.
      # Shared runners are too noisy for the numbers to mean anything.
      - run: zig build bench

  # The one check `main` requires: it passes only when every job above
  # passed, so renaming or adding a matrix entry never changes the rule.
  # It runs even when one failed (`always()`), or a skipped gate would let
  # the pull request merge.
  ci:
    if: always()
    needs: [fmt, test, alpine, qemu-aarch64, cross, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a required job ended as: $r"
              exit 1
            fi
          done

  # The newest stable Zig, to learn early what the next upgrade breaks.
  # Not required: the project builds with the pinned release only.
  zig-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: latest
      - run: zig build test --summary all --test-timeout 3m
        timeout-minutes: 15
